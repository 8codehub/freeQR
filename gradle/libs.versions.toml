[versions]
kotlin = "2.4.21"
compose = "1.12.2"
agp = "9.1.1"
lifecycle = "2.11.0"
coroutines = "1.11.0"
serialization = "1.11.0"
activity = "1.13.0"
datastore = "1.3.0"
firebaseBom = "34.17.0"
googleServices = "4.4.2"

[libraries]
lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-core = { module = "androidx.core:core-ktx", version = "1.19.1" }
datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
datastore-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
qrcode = { module = "io.github.g0dkar:qrcode-kotlin", version = "4.5.0" }
profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version = "1.4.1" }
androidx-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
androidx-runner = { module = "androidx.test:runner", version = "1.7.0" }
compose-uitest = { module = "androidx.compose.ui:ui-test-junit4", version = "1.12.1" }
compose-uitest-manifest = { module = "androidx.compose.ui:ui-test-manifest", version = "1.12.1" }
robolectric = { module = "org.robolectric:robolectric", version = "4.16" }
junit = { module = "junit:junit", version = "4.13.2" }
zxing-test = { module = "com.google.zxing:core", version = "3.5.3" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
android-application = { id = "com.android.application", version.ref = "agp" }

android-kmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
